# DaKnowledge Configuration
# Theological Research Knowledge Base

name: DaKnowledge
version: 1.0.0
description: Research-focused theological knowledge base

# Topic Ontology
# Keep ids aligned with website/docs/ folders.
topics:
  - id: theology-proper
    name: Theology Proper
    subtopics:
      - attributes-of-god
      - names-of-god
      - existence-of-god

  - id: trinity
    name: Trinity
    subtopics:
      - the-father
      - the-son
      - the-holy-spirit
      - economic-immanent
      - persons-of-the-trinity

  - id: christology
    name: Christology
    subtopics:
      - hypostatic-union
      - two-natures
      - person-of-christ
      - work-of-christ

  - id: pneumatology
    name: Pneumatology
    subtopics:
      - person-of-the-spirit
      - work-of-the-spirit
      - spiritual-gifts

  - id: soteriology
    name: Soteriology
    subtopics:
      - justification
      - sanctification
      - election
      - atonement

  - id: ecclesiology
    name: Ecclesiology
    subtopics:
      - nature-of-the-church
      - church-government

  - id: sacraments
    name: Sacraments
    subtopics:
      - baptism
      - confirmation
      - eucharist
      - reconciliation
      - anointing
      - holy-orders
      - matrimony

  - id: scripture
    name: Scripture
    subtopics:
      - inspiration
      - canon
      - interpretation
      - biblical-theology

  - id: prayer
    name: Prayer
    subtopics:
      - lords-prayer
      - hail-mary
      - glory-be
      - apostles-creed
      - liturgical-prayer
      - personal-prayer
      - contemplative-prayer
      - devotional-prayer

  - id: relics
    name: Relics
    subtopics:
      - shroud-of-turin
      - true-cross
      - crown-of-thorns
      - holy-lance
      - veil-of-veronica

  - id: spiritual-formation
    name: Spiritual Formation
    subtopics:
      - discipleship-reflection

  - id: mariology
    name: Mariology
    subtopics:
      - theotokos
      - immaculate-conception
      - assumption

  - id: moral-theology
    name: Moral Theology
    subtopics:
      - law-and-conscience
      - virtue-and-sin

  - id: eschatology
    name: Eschatology
    subtopics:
      - death-and-judgment
      - last-things

# Source Categories
sources:
  - id: scripture
    name: Sacred Scripture
  - id: magisterium
    name: Magisterium
    period: living
  - id: church-fathers
    name: Church Fathers
    period: 100-750 AD
  - id: doctors
    name: Doctors of the Church
  - id: modern-scholars
    name: Modern Scholars
    period: 1800-present
  - id: books
    name: Ingested Books

# Scripture Index Settings
scripture:
  enabled: true
  canon: catholic
  books: 73
  auto_index: true

# Search Settings
# full_text is implemented by src/engine.js.
# semantic_search is planned, not implemented.
search:
  full_text: true
  semantic_search: false
  scripture_citations: true

# Integration
integrations:
  dashboard: true
  danotify: true

# Privacy
privacy:
  encryption: false
  git_sync: true

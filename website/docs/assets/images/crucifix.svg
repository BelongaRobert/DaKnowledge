<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Latin cross with INRI titulus">
  <rect width="512" height="512" rx="96" fill="#4a1515"/>
  <!-- Latin cross: empty wood, no corpus -->
  <rect x="218" y="56" width="76" height="400" rx="10" fill="#d4af37"/>
  <rect x="86" y="148" width="340" height="76" rx="10" fill="#d4af37"/>
  <!-- INRI titulus above the crossbar -->
  <rect x="196" y="72" width="120" height="44" rx="4" fill="#c9a227"/>
  <rect x="202" y="78" width="108" height="32" rx="2" fill="#3a1008"/>
  <text x="256" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#e8c547" letter-spacing="2">INRI</text>
</svg>

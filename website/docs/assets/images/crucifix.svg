<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#2E0000"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Cross -->
  <g transform="translate(256, 256)">
    <!-- Vertical beam -->
    <rect x="-18" y="-200" width="36" height="360" rx="4" fill="#D4AF37"/>
    <!-- Horizontal beam -->
    <rect x="-120" y="-80" width="240" height="36" rx="4" fill="#D4AF37"/>
    <!-- Title board -->
    <rect x="-40" y="-200" width="80" height="30" rx="2" fill="#D4AF37"/>
    <text x="0" y="-178" text-anchor="middle" font-size="18" font-family="serif" fill="#2E0000" font-weight="bold">INRI</text>

    <!-- Corpus (stylized silhouette) -->
    <g fill="#E8D5B7">
      <!-- Head -->
      <circle cx="0" cy="-140" r="22"/>
      <!-- Torso -->
      <ellipse cx="0" cy="-80" rx="24" ry="55"/>
      <!-- Arms -->
      <ellipse cx="-55" cy="-95" rx="35" ry="12" transform="rotate(-15, -55, -95)"/>
      <ellipse cx="55" cy="-95" rx="35" ry="12" transform="rotate(15, 55, -95)"/>
      <!-- Legs -->
      <ellipse cx="-12" cy="-10" rx="14" ry="55" transform="rotate(-8, -12, -10)"/>
      <ellipse cx="12" cy="-10" rx="14" ry="55" transform="rotate(8, 12, -10)"/>
      <!-- Halo -->
      <circle cx="0" cy="-140" r="28" fill="none" stroke="#D4AF37" stroke-width="3"/>
    </g>

    <!-- Feet overlap on cross -->
    <ellipse cx="0" cy="35" rx="14" ry="10" fill="#E8D5B7"/>
  </g>
</svg>
